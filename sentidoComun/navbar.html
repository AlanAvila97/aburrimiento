<!DOCTYPE html>
<html lang="en">
    <head>
        <title></title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            /*--------------------------------------------------------------
            # Scroll
            --------------------------------------------------------------*/
            .scroll-menu{
                overflow-y: scroll;
            }
            .scroll-menu::-webkit-scrollbar{
                width: 14px;
            }
            .scroll-menu::-webkit-scrollbar-thumb{
                background: #ccc;
                border-radius: 5px;
                height: 45px;
            }
            /*--------------------------------------------------------------
            # 
            --------------------------------------------------------------*/
            .header{
                width: 100%;
                height: 80px;
                background: #0d0c16;
                padding: 0rem 4rem;
                box-sizing: border-box;
            }
            .header *{
                box-sizing: border-box;
            }   
            .header .container-header{
                display: grid;
                grid-template-columns: 0px 40% 1fr 200px;
                align-items: center;
                width: 100%;
                height: 100%;
                justify-items: end;
            }
            .header .container-header .content-menu-hamburguer{
                display: flex;
                align-items: center;
                width: 100%;
                height: 100%;
                justify-content: center;
            }
            .header .container-header .content-menu-hamburguer .menu-btn {
                display: block;
                width: 36px;
                background-color: transparent;
                cursor: pointer;
                appearance: none;
                box-sizing: border-box;
                margin: 3px 3px 3px 4px;
                padding: initial;
                border: none;
            }
            .header .container-header .content-menu-hamburguer .menu-btn:before,
            .header .container-header .content-menu-hamburguer .menu-btn:after{
                content: '';
                background-color: #fff;
                height: 4px;
                display: block;
                margin-bottom: 5px;
                transition: all 200ms ease-in-out;
            }
            .header .container-header .content-menu-hamburguer .menu-btn:before {
                box-shadow: 0 10px 0 #fff;
                margin-bottom: 16px;
            }
            .header .container-header .content-menu-hamburguer .menu-btn:checked{
                z-index: 5;
            }
            .header .container-header .content-menu-hamburguer .menu-btn:checked.menu-btn:before {
                box-shadow: 0 0 0 #fff;
                transform: translateY(10px) rotate(45deg);
            }
            .header .container-header .content-menu-hamburguer .menu-btn:checked.menu-btn:after {
                transform: translateY(-10px) rotate(-45deg);
            }
            .header .container-header .content-menu-hamburguer .menu-btn:checked ~ #sidebarMenu {
                transform: translateX(0);
                display: block;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu {
                position: fixed;
                top: 0px;
                left: 0;
                display: none;
                width: 100%;
                height: -webkit-fill-available;
                min-height: 100%;
                padding-top: 80px;
                background: rgb(0 0 0 / 86%);
                text-transform: uppercase;
                transform: translateX(-250%);
                transition: transform 250ms ease-in-out;
                -webkit-transition: transform 250ms ease-in-out;
                -moz-transition: transform 250ms ease-in-out;
                -ms-transition: transform 250ms ease-in-out;
                -o-transition: transform 250ms ease-in-out;
                z-index: 4;
                -webkit-transform: translateX(-250%);
                -moz-transform: translateX(-250%);
                -ms-transform: translateX(-250%);
                -o-transform: translateX(-250%);
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu{
                width: 100%;
                height: 100%;
                max-height: 90%;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .items{
                cursor: pointer;
                text-decoration: none;
                text-transform: capitalize;
                color: #fafafa;
                font-size: 1.7em;
                margin: 2%;
                transition: opacity 0.2s linear;
                -webkit-transition: opacity 0.2s linear;
                -moz-transition: opacity 0.2s linear;
                -ms-transition: opacity 0.2s linear;
                -o-transition: opacity 0.2s linear;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .items .img-multiplataforma {
                width: auto;
                height: 50px;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .items.onceplus a{
                width: auto;
                height: 50px;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .items.onceplus picture{
                width: 100%;
                height: auto;
                display: flex;
                justify-content: center;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .items.onceplus picture img{
                width: 75%;
                height: auto;
                object-fit: cover;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .items picture img{
                width: auto;
                height: auto;
                object-fit: cover;
                max-height: 68px;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .items picture .img-mexico{
                max-height: 40px;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .small-items{
                cursor: pointer;
                text-decoration: none;
                color: #fafafa;
                font-size: 1.5em;
                margin: 2%;
                transition: opacity 0.2s linear;
                -webkit-transition: opacity 0.2s linear;
                -moz-transition: opacity 0.2s linear;
                -ms-transition: opacity 0.2s linear;
                -o-transition: opacity 0.2s linear;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu a:hover {
                opacity: 1;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-social-networks{
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                flex-wrap: nowrap;
                align-items: center;
                width: 100%;
                padding-top: 5%;
                padding-bottom: 5%;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-social-networks .social-icons i{
                color: #fff;
                cursor: pointer;
                font-size: 1.5em;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-social-networks .social-icons:focus,
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-social-networks .social-icons:hover{
                color: red;
                transform: rotate(360deg) translateZ(0);
                -webkit-transform: rotate(360deg) translateZ(0);
                -moz-transform: rotate(360deg) translateZ(0);
                -ms-transform: rotate(360deg) translateZ(0);
                -o-transform: rotate(360deg) translateZ(0);
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks{
                width: 100%;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks .networks{
                cursor: pointer;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks .networks picture{
                width: 100%;
                height: 100%;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks .networks img{
                padding-bottom: 5%;
                width: 100%;
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks .networks:hover .network-digital{
                filter: brightness(0.5);
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks .networks:hover .network-noticias{
                filter: brightness(0.5);
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks .networks:hover .network-ninas-ninos{
                filter: brightness(0.5);
            }
            .header .container-header .content-menu-hamburguer #sidebarMenu .container-menu .container-networks .networks:hover .network-once-mexico{
                filter: brightness(0.5);
            }
            .header .container-header .logo{
                display: flex;
                justify-content: center;
                z-index: 5;
            }
            .header .container-header .logo a{
                width: auto;
                height: auto;
            }
            .header .container-header .logo picture img{
                width: 100%;
                height: auto;
                display: block;
                object-fit: cover;
                max-width: 100%;
                max-height: 75px;
            }
            .header .container-header .sections-nav{
                height: 100%;
                width: 100%;
                display: flex;
                align-items: center;
            }
            .header .container-header .sections-nav .elements-nav{
                list-style: none;
                display: flex;
                align-items: center;
                justify-content: space-evenly;
                width: 100%;
                margin-bottom: 0;
            }
            .header .container-header .sections-nav .elements-nav li{
                width: auto;
                line-height: normal;
                text-transform: none;
            }
            .header .container-header .sections-nav .elements-nav li a{
                display: flex;
                justify-content: space-evenly;
                text-decoration: none;
            }
            .header .container-header .sections-nav .elements-nav li a h3{
                color: #fff;
                font-size: clamp(1rem, 1.2rem, 2rem);
            }
            .header .container-header .sections-nav .elements-nav li p{
                display: flex;
                justify-content: space-evenly;
            }
            @media (max-width: 991px){
                /*-------------------------------------------------------------
                # Header
                --------------------------------------------------------------*/
                .header {
                    padding: 0rem;
                }
                .header .container-header{
                    grid-template-columns: 50px 1fr 0px;
                    justify-items: start;
                }
                .header .container-header .sections-nav{
                    display: none;
                }
                .header .container-header .content-menu-hamburguer #sidebarMenu {
                    display: block;
                }
            }
            @media (max-width: 600px){
                .header .container-header .logo picture img{
                    max-height: 60px;
                }
            }
            @media (max-width: 500px){
                .header .container-header .logo picture img{
                    max-height: 50px;
                }
            }
        </style>
    </head>
    <body>
        <header class="header fixed-top header-sentido">
            <div class="container-header">
                <div class="content-menu-hamburguer">
                    <input type="checkbox" class="menu-btn" id="openSidebarMenu">
                    <div id="sidebarMenu">
                        <div class="container-menu scroll-menu">
                            <a id="MenuInicio" href="./" class="items " aria-labelledbyledby="firstname"="Redirección a página principal">Inicio</a>
                            <hr>
                        </div>
                    </div>
                </div>
                <div class="logo">
                    <a href="/" aria-labelledby="Redirección a página principal">                    
                        <picture>
                            <source class="lazy img-fluid" srcset="https://sentidocomunmx.com/wp-content/uploads/2026/01/logo-sentido-comun_processed.png" type="image/webp">
                            <source class="lazy img-fluid" srcset="https://sentidocomunmx.com/wp-content/uploads/2026/01/logo-sentido-comun_processed.png" type="image/png"> 
                            <img class="img-fluid lazy" src="https://sentidocomunmx.com/wp-content/uploads/2026/01/logo-sentido-comun_processed.png" alt="Logo Once" width="139" height="45">
                        </picture>
                    </a>
                </div><!-- End div logo -->
                <div class="sections-nav">
                    <ul class="elements-nav">
                        <li > 
                            <a href="./en-vivo" aria-labelledby="Redirección a página en vivo">
                                <h3> En vivo </h3>
                            </a>
                        </li>
                        <li >
                            <a href="./horarios" aria-labelledby="Redirección a página horarios"> 
                                <h3> Horarios </h3>
                            </a>
                        </li>                
                        <li > 
                            <a href="./en-vivo" aria-labelledby="Redirección a página en vivo">
                                <h3> En vivo </h3>
                            </a>
                        </li>
                        <li >
                            <a href="./horarios" aria-labelledby="Redirección a página horarios"> 
                                <h3> Horarios </h3>
                            </a>
                        </li>                
                    </ul>
                </div>
                <form role="search" method="get" action="https://sentidocomunmx.com/" 
                    style="margin-top:0;margin-bottom:0;margin-left:var(--wp--preset--spacing--30);margin-right:var(--wp--preset--spacing--30);" 
                    class="wp-block-search_button-inside wp-block-searchtext-button alignleft wp-block-search">

                        style="width: 100%;border-width: 10px;border-top-left-radius: calc(10px + 4px);border-top-right-radius: calc(10px + 4px);border-bottom-left-radius: calc(10px + 4px);border-bottom-right-radius: calc(10px + 4px)"><input class="wp-block-searchinput has-small-font-size" id="wp-block-searchinput-1" placeholder="" value="peso mexicano" type="search" name="s" required="" style="border-top-left-radius: 10px;border-top-right-radius: 10px;border-bottom-left-radius: 10px;border-bottom-right-radius: 10px">
                        <button aria-label="Buscar" class="wp-block-search_button has-small-font-size wp-element-button" type="submit" style="border-top-left-radius: 10px;border-top-right-radius: 10px;border-bottom-left-radius: 10px;border-bottom-right-radius: 10px">
                            Buscar
                        </button>
                    </div>
                </form>
            </div>
        </header>
    </body>
</html>
