<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En Construcción</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --yellow: #FFD600;
    --dark: #0D0D0D;
    --mid: #1A1A1A;
    --steel: #2E2E2E;
    --orange: #FF6B00;
    --white: #F0EDE6;
  }

  body {
    background-color: var(--dark);
    color: var(--white);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
    opacity: 0.4;
  }

  /* Diagonal warning stripes at top and bottom */
  .stripe-bar {
    position: fixed;
    left: 0; right: 0;
    height: 14px;
    background: repeating-linear-gradient(
      -45deg,
      var(--yellow) 0px, var(--yellow) 16px,
      var(--dark) 16px, var(--dark) 32px
    );
    z-index: 20;
  }
  .stripe-bar.top { top: 0; }
  .stripe-bar.bottom { bottom: 0; }

  /* Main container */
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    z-index: 5;
    padding: 20px;
  }

  /* SVG Scene */
  .scene {
    width: 380px;
    max-width: 90vw;
    filter: drop-shadow(0 0 30px rgba(255,214,0,0.15));
  }

  /* Ground platform */
  .ground { fill: var(--steel); }
  .ground-line { stroke: var(--yellow); stroke-width: 2; fill: none; }

  /* Building blocks */
  .block {
    fill: #2A2A2A;
    stroke: #444;
    stroke-width: 1;
  }
  .block-shine {
    fill: none;
    stroke: rgba(255,255,255,0.08);
    stroke-width: 1;
  }

  /* Crane tower */
  .crane-tower { fill: #333; stroke: #555; stroke-width: 1.5; }
  .crane-arm { fill: #3A3A3A; stroke: var(--yellow); stroke-width: 1.5; }
  .crane-detail { stroke: var(--yellow); stroke-width: 1; fill: none; opacity: 0.6; }

  /* Cable and hook */
  .cable { stroke: #888; stroke-width: 1.5; fill: none; }
  .hook { stroke: #aaa; stroke-width: 2; fill: none; }

  /* Hanging block */
  .hanging-block {
    fill: var(--yellow);
    stroke: var(--orange);
    stroke-width: 1.5;
  }

  /* Scaffolding */
  .scaffold { stroke: #666; stroke-width: 1; fill: none; }
  .scaffold-plank { fill: #5a3f1e; stroke: #7a5a30; stroke-width: 1; }

  /* Workers (hard hats) */
  .worker-body { fill: #555; }
  .worker-hat { fill: var(--yellow); }
  .worker-skin { fill: #c68642; }

  /* Sparks */
  .spark {
    fill: var(--yellow);
    animation: sparkle 0.6s ease-in-out infinite alternate;
  }
  .spark:nth-child(2) { animation-delay: 0.1s; fill: var(--orange); }
  .spark:nth-child(3) { animation-delay: 0.25s; }
  .spark:nth-child(4) { animation-delay: 0.4s; fill: var(--orange); }

  @keyframes sparkle {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(0.3) translate(3px, -4px); }
  }

  /* Crane arm swing */
  .crane-group {
    transform-origin: 200px 60px;
    animation: crane-sway 4s ease-in-out infinite;
  }
  @keyframes crane-sway {
    0%, 100% { transform: rotate(0deg); }
    40%       { transform: rotate(4deg); }
    60%       { transform: rotate(-2deg); }
  }

  /* Hanging block oscillates */
  .payload {
    animation: swing 4s ease-in-out infinite;
    transform-origin: 270px 95px;
  }
  @keyframes swing {
    0%, 100% { transform: translateX(0px) translateY(0px); }
    40%       { transform: translateX(9px) translateY(2px); }
    60%       { transform: translateX(-4px) translateY(1px); }
  }

  /* Building blocks appear one by one */
  .build-row-1 { animation: appear 0.4s ease forwards; animation-delay: 0.2s; opacity: 0; }
  .build-row-2 { animation: appear 0.4s ease forwards; animation-delay: 0.8s; opacity: 0; }
  .build-row-3 { animation: appear 0.4s ease forwards; animation-delay: 1.4s; opacity: 0; }
  .build-row-4 { animation: appear 0.4s ease forwards; animation-delay: 2.0s; opacity: 0; }

  @keyframes appear {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Worker bob */
  .worker-left {
    animation: bob 1.2s ease-in-out infinite;
    transform-origin: 110px 215px;
  }
  .worker-right {
    animation: bob 1.2s ease-in-out infinite reverse;
    transform-origin: 270px 210px;
    animation-delay: 0.3s;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-3px); }
  }

  /* Dust puffs */
  .dust {
    fill: rgba(255,255,255,0.06);
    animation: puff 2s ease-out infinite;
  }
  .dust:nth-child(2) { animation-delay: 0.7s; }
  .dust:nth-child(3) { animation-delay: 1.4s; }
  @keyframes puff {
    0%   { opacity: 0; transform: scale(0.5) translateY(0); }
    30%  { opacity: 1; }
    100% { opacity: 0; transform: scale(2) translateY(-20px); }
  }

  /* Blinking light on crane */
  .blink-light {
    fill: var(--orange);
    animation: blink 1s step-start infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* ── Typography ── */
  .tag-line {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.35em;
    color: var(--yellow);
    text-transform: uppercase;
    opacity: 0.8;
  }

  h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(38px, 8vw, 72px);
    letter-spacing: 0.02em;
    line-height: 1;
    text-align: center;
    color: var(--white);
  }
  h1 span {
    color: var(--yellow);
    display: block;
  }

  .subtitle {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: #888;
    text-align: center;
    max-width: 340px;
    line-height: 1.7;
  }

  /* Progress bar */
  .progress-wrap {
    width: 340px;
    max-width: 88vw;
    border: 1px solid #333;
    padding: 3px;
    position: relative;
  }
  .progress-wrap::before {
    content: 'PROGRESO';
    position: absolute;
    top: -10px;
    left: 8px;
    font-size: 9px;
    letter-spacing: 0.3em;
    background: var(--dark);
    padding: 0 4px;
    color: #555;
  }
  .progress-bar {
    height: 8px;
    background: repeating-linear-gradient(
      90deg,
      var(--yellow) 0px, var(--yellow) 8px,
      var(--orange) 8px, var(--orange) 16px
    );
    background-size: 200% 100%;
    animation: march 1.2s linear infinite;
    width: 65%;
  }
  @keyframes march {
    from { background-position: 0 0; }
    to   { background-position: 32px 0; }
  }
  .progress-pct {
    font-size: 10px;
    color: #666;
    text-align: right;
    margin-top: 5px;
    letter-spacing: 0.1em;
  }

  /* Social / back link */
  .footer-note {
    font-size: 10px;
    color: #444;
    letter-spacing: 0.15em;
    text-align: center;
    margin-top: 8px;
  }
  .footer-note a { color: var(--yellow); text-decoration: none; }
  .footer-note a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="stripe-bar top"></div>
<div class="stripe-bar bottom"></div>

<div class="container">

  <p class="tag-line">&#9888; Sitio temporalmente fuera de línea</p>

  <!-- SVG SCENE -->
  <svg class="scene" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg">

    <!-- Ground -->
    <rect class="ground" x="0" y="230" width="380" height="30" rx="2"/>
    <line class="ground-line" x1="0" y1="230" x2="380" y2="230"/>

    <!-- Dust puffs near base -->
    <g>
      <circle class="dust" cx="140" cy="225" r="10"/>
      <circle class="dust" cx="165" cy="222" r="7"/>
      <circle class="dust" cx="155" cy="226" r="5"/>
    </g>

    <!-- Building under construction -->
    <!-- Row 1 (bottom) -->
    <g class="build-row-1">
      <rect class="block" x="80" y="200" width="38" height="28" rx="1"/>
      <rect class="block" x="120" y="200" width="38" height="28" rx="1"/>
      <rect class="block" x="160" y="200" width="38" height="28" rx="1"/>
      <rect class="block" x="200" y="200" width="38" height="28" rx="1"/>
      <line class="block-shine" x1="83" y1="203" x2="83" y2="226"/>
      <line class="block-shine" x1="123" y1="203" x2="123" y2="226"/>
      <line class="block-shine" x1="163" y1="203" x2="163" y2="226"/>
      <line class="block-shine" x1="203" y1="203" x2="203" y2="226"/>
    </g>
    <!-- Row 2 -->
    <g class="build-row-2">
      <rect class="block" x="80" y="170" width="38" height="28" rx="1"/>
      <rect class="block" x="120" y="170" width="38" height="28" rx="1"/>
      <rect class="block" x="160" y="170" width="38" height="28" rx="1"/>
      <rect class="block" x="200" y="170" width="38" height="28" rx="1"/>
    </g>
    <!-- Row 3 -->
    <g class="build-row-3">
      <rect class="block" x="80" y="140" width="38" height="28" rx="1"/>
      <rect class="block" x="120" y="140" width="38" height="28" rx="1"/>
      <rect class="block" x="160" y="140" width="38" height="28" rx="1"/>
    </g>
    <!-- Row 4 (partial / top) -->
    <g class="build-row-4">
      <rect class="block" x="80" y="110" width="38" height="28" rx="1"/>
      <rect class="block" x="120" y="110" width="38" height="28" rx="1"/>
    </g>

    <!-- Scaffolding left side -->
    <g class="scaffold">
      <line x1="60" y1="110" x2="60" y2="230"/>
      <line x1="75" y1="110" x2="75" y2="230"/>
      <line x1="60" y1="140" x2="75" y2="140"/>
      <line x1="60" y1="170" x2="75" y2="170"/>
      <line x1="60" y1="200" x2="75" y2="200"/>
      <line x1="60" y1="220" x2="75" y2="220"/>
    </g>
    <rect class="scaffold-plank" x="58" y="137" width="20" height="4" rx="1"/>
    <rect class="scaffold-plank" x="58" y="167" width="20" height="4" rx="1"/>
    <rect class="scaffold-plank" x="58" y="197" width="20" height="4" rx="1"/>

    <!-- Worker LEFT (on scaffold) -->
    <g class="worker-left">
      <!-- body -->
      <rect class="worker-body" x="103" y="218" width="10" height="11" rx="1"/>
      <!-- head -->
      <circle class="worker-skin" cx="108" cy="214" r="4.5"/>
      <!-- hat -->
      <ellipse class="worker-hat" cx="108" cy="211" rx="6" ry="3.5"/>
      <rect class="worker-hat" x="104" y="208" width="8" height="3" rx="1"/>
      <!-- arms -->
      <line stroke="#444" stroke-width="2" x1="103" y1="220" x2="96" y2="216"/>
      <line stroke="#444" stroke-width="2" x1="113" y1="220" x2="120" y2="216"/>
    </g>

    <!-- Sparks at construction point -->
    <g transform="translate(160, 107)">
      <circle class="spark" cx="0" cy="0" r="2.5"/>
      <circle class="spark" cx="5" cy="-3" r="1.5"/>
      <circle class="spark" cx="-4" cy="-4" r="2"/>
      <circle class="spark" cx="8" cy="1" r="1"/>
    </g>

    <!-- CRANE -->
    <!-- Tower -->
    <rect class="crane-tower" x="295" y="70" width="18" height="165" rx="2"/>
    <!-- Tower cross braces -->
    <line class="crane-detail" x1="295" y1="90" x2="313" y2="110"/>
    <line class="crane-detail" x1="313" y1="90" x2="295" y2="110"/>
    <line class="crane-detail" x1="295" y1="130" x2="313" y2="150"/>
    <line class="crane-detail" x1="313" y1="130" x2="295" y2="150"/>
    <line class="crane-detail" x1="295" y1="170" x2="313" y2="190"/>
    <line class="crane-detail" x1="313" y1="170" x2="295" y2="190"/>

    <!-- Crane arm group (animated) -->
    <g class="crane-group">
      <!-- Horizontal arm -->
      <rect class="crane-arm" x="190" y="58" width="115" height="12" rx="2"/>
      <!-- Counter weight -->
      <rect class="crane-arm" x="300" y="70" width="20" height="18" rx="2" fill="#444"/>
      <!-- Arm cable supports -->
      <line stroke="#FFD600" stroke-width="1" x1="304" y1="58" x2="230" y2="70"/>
      <line stroke="#FFD600" stroke-width="1" x1="304" y1="58" x2="260" y2="70"/>
      <!-- Operator cab -->
      <rect fill="#2A2A2A" stroke="#FFD600" stroke-width="1" x="280" y="70" width="18" height="14" rx="1"/>
      <rect fill="rgba(100,180,255,0.2)" stroke="none" x="283" y="72" width="12" height="9" rx="1"/>
      <!-- Blink light -->
      <circle class="blink-light" cx="192" cy="63" r="3"/>
    </g>

    <!-- Cable and payload (animated separately) -->
    <g class="payload">
      <line class="cable" x1="250" y1="70" x2="250" y2="118"/>
      <!-- Hook -->
      <path class="hook" d="M247,118 Q244,125 248,128 Q252,131 254,127" stroke-linecap="round"/>
      <!-- Hanging block -->
      <rect class="hanging-block" x="235" y="130" width="32" height="22" rx="2"/>
      <line stroke="rgba(0,0,0,0.3)" stroke-width="1" x1="248" y1="130" x2="248" y2="152"/>
      <line stroke="rgba(255,255,255,0.15)" stroke-width="1" x1="237" y1="133" x2="237" y2="149"/>
    </g>

    <!-- Worker RIGHT (on ground, directing) -->
    <g class="worker-right">
      <rect class="worker-body" x="262" y="218" width="10" height="11" rx="1"/>
      <circle class="worker-skin" cx="267" cy="214" r="4.5"/>
      <ellipse class="worker-hat" cx="267" cy="211" rx="6" ry="3.5"/>
      <rect class="worker-hat" x="263" y="208" width="8" height="3" rx="1"/>
      <!-- Arm pointing up -->
      <line stroke="#444" stroke-width="2" x1="272" y1="220" x2="278" y2="210"/>
    </g>

  </svg>
  <!-- end SVG -->

  <h1>BAJO<span>MANTENIMIENTO</span></h1>

  <p class="subtitle">
    Estamos trabajando duro para mejorar el sitio.<br>
    Volvemos pronto — gracias por tu paciencia.
  </p>

</div>

</body>
</html>
