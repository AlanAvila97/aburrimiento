<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preload" href="../assets/css/fontawesome/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="../assets/fontawesome/css/fontawesome.css"></noscript>
    <link rel="preload" href="../assets/css/fontawesome/css/solid.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="../assets/fontawesome/css/solid.min.css"></noscript>
    <link rel="preload" href="../assets/css/fontawesome/css/regular.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="../assets/fontawesome/css/regular.min.css"></noscript>
    <link rel="preload" href="../assets/css/fontawesome/css/brands.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="../assets/fontawesome/css/brands.min.css"></noscript>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
        }
        .menu{
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu .toggle{
            position: absolute;
            width: 55px;
            height: 55px;
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.5s;
        }
        .menu .toggle i{
            font-size: 2.5rem;
        }
        .menu i{
            color: #0f0;
        }
        .menu .toggle.active{
            transform: rotate(270deg);
            background: #000;
            color: #000;
        }
        .menu li{
            position: absolute;
            left: 10px;
            list-style: none;
            transform-origin: 140px;
            border: 2px solid #0f0;
            border-radius: 1rem;
            transform: rotate(calc(360deg / 4 * var(--i))) translateX(40px);
            z-index: 10;
            pointer-events: none;
            scale: 0;
            transition: 0.5s;
            transition-delay: calc(0.1s * var(--i));
        }
        .menu.active li{
            scale: 1.141;
            pointer-events: initial;
        }
        .menu li a{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45px;
            height: 45px;
            border-radius: 1rem; 
            cursor: pointer;
            transition: 0.5s;   
            transform: rotate(calc(360deg / -4 * var(--i)));
            z-index: 1000;
        }
        .menu li a{
            font-size: 1.3em;
        }
        .menu li.active a{
            background-color: #0f0;
        }
        .menu li.active a i{
            color: #000;
        }
    </style>
</head>
<body>
    <ul class="menu">
        <div class="toggle">
            <i class="fa-solid fa-ellipsis"></i>
        </div>
        <li style="--i:0;">
            <a href="#">
                <i class="fa-solid fa-user"></i>
            </a>
        </li>
        <li style="--i:1;">
            <a href="#">
                <i class="fa-solid fa-user"></i>
            </a>
        </li>
        <li style="--i:2;">
            <a href="#">
                <i class="fa-solid fa-user"></i>
            </a>
        </li>
        <li style="--i:3;">
            <a href="#">
                <i class="fa-solid fa-user"></i>
            </a>
        </li>
    </ul>
    <script src="./assets/js/action-main.js"></script>
    <script>
        let menuToggle =  document.querySelector('.toggle');
        let menu =  document.querySelector('.menu');
        let list =  document.querySelectorAll('li')
        const handleItemList = (e) => {
            let item =  e.target.closest('li');
            if(item){
                removeAllClass(list, 'active')
                item.classList.add('active');
            }
        }
        menuToggle.onclick = () => {
            menu.classList.toggle('active');
            menuToggle.classList.toggle('active')
        }
        list.forEach(item => {
            item.addEventListener('click', (e) => handleItemList(e) )
        });
    </script>
</body>
</html>
